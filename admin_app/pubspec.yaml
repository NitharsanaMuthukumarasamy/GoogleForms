name: admin_app
description: "Alumni Lecture Feedback System - Admin Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.0.1
  cloud_functions: ^5.0.1

  # Local Persistence & Connectivity
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3

  # UI, Icons, Typography & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0

  # Export Suite (Excel, CSV, PDF)
  excel: ^4.0.6
  csv: ^6.0.0
  pdf: ^3.10.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/college_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B2545"
  adaptive_icon_foreground: "assets/images/college_logo.png"

flutter_native_splash:
  color: "#0B2545"
  image: "assets/images/college_logo.png"
  android_12:
    color: "#0B2545"
    image: "assets/images/college_logo.png"
